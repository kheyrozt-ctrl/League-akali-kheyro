on:
  push:
    branches:
      - main
      - deft-rabi
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Pre build
      - name: Get 7-digit commit SHA
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Insert SHA to version string
        run: |
          $json = Get-Content package.json -Raw | ConvertFrom-Json
          $json.version += "+$env:SHORT_SHA"
          $json | ConvertTo-Json | Set-Content package.json

      - name: Modify electron-builder.yml
        shell: pwsh
        run: |
          $yamlContent = Get-Content -Path electron-builder.yml -Raw
          $yamlContent = $yamlContent -replace "target: 7z", "target: dir"
          Set-Content -Path electron-builder.yml -Value $yamlContent

      - name: Get final akari version
        run: |
          $AKARI_VERSION = (Get-Content package.json | ConvertFrom-Json).version
          echo "akari_version=$AKARI_VERSION" >> $env:GITHUB_ENV

      # Build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable repository Yarn
        shell: pwsh
        run: |
          corepack enable
          yarn --version

      - name: Validate GitHub Packages auth
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NODE_AUTH_TOKEN)) {
            Write-Error "NPM_AUTH_TOKEN secret is missing."
            exit 1
          }
          yarn npm whoami --scope leagueakari

      - name: Run yarn install
        shell: pwsh
        run: yarn install --immutable

      - name: Run yarn build:win
        shell: pwsh
        run: yarn build:win

      # Post build
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: League Akari-${{ env.akari_version }}
          path: dist/win-unpacked
